# Simulation Configuration for Dual-Trigger QTK Testbed
simulation:
  epochs_per_run: 30
  num_legitimate_devices: 3
  num_rogue_devices: 1
  injection_epoch: 10
  default_profile: "Student"
  base_seed: 42

profiles:
