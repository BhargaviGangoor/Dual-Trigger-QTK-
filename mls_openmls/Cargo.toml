[package]
name = "mls_openmls"
version = "0.1.0"
edition = "2021"
description = "Real OpenMLS 0.9.0 adapter for Dual-Trigger QTK behavioral detection PoC"

[[bin]]
name = "mls_openmls"
path = "src/main.rs"

[dependencies]
# OpenMLS 0.9.0 — real RFC 9420 implementation
openmls = { version = "0.9", features = ["test-utils"] }
openmls_rust_crypto = "0.9"
openmls_basic_credential = { version = "0.9", features = ["clonable", "test-utils"] }
openmls_memory_storage = { version = "0.9", features = ["test-utils"] }

# JSON I/O for Python bridge communication
serde = { version = "1", features = ["derive"] }
serde_json = "1"
